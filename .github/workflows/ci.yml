name: CI

# The gates this repo relies on, all of which were previously run by hand.
#
# Deliberately NO `cargo fmt --check`. `crates/jparser/src/conjugation.rs` is
# intentionally not rustfmt-clean, and reformatting it is a defect — the port
# keeps its table layout readable against the C++ original. Formatting is done
# per-file with `rustfmt --edition 2021 <file>`, never `cargo fmt`. Please do
# not "helpfully" add a formatting job here.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # src-tauri joined the workspace in Phase 2D, so every job that compiles
      # the workspace now links against webkit2gtk. Only the dev package for
      # what is actually linked is installed: `cargo tree -p
      # clipyomi -e normal --target x86_64-unknown-linux-gnu`
      # resolves to `gtk` + `webkit2gtk` and nothing else Tauri-related — no
      # `tray-icon`, no `libappindicator`, no `xdo`. `librsvg2-dev` and
      # `patchelf` are bundling-only tools and `bundle.active` is `false`
      # (`src-tauri/tauri.conf.json`); `libssl-dev` has no TLS crate in the
      # tree to link against. The previous list was also simply broken:
      # `libappindicator3-dev` does not exist on `ubuntu-latest` (24.04+,
      # where it was renamed `libayatana-appindicator3-dev`), so
      # `apt-get install -y` would have exited non-zero on the very first run.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --workspace

      - run: cargo clippy --workspace --all-targets -- -D warnings

  msrv:
    name: MSRV ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Must match `rust-version` in the root Cargo.toml. This job is the only
        # thing that makes the declared floor real: `resolver = "2"` ignores
        # `rust-version` when selecting versions, so a dependency that raises its
        # own MSRV compiles fine on a newer toolchain and the violation is
        # invisible until someone actually builds with the floor. That is exactly
        # how `clap` drifted onto `clap_lex 1.1` (edition2024, Rust 1.85) and went
        # unnoticed for three phases — history now, since the floor moved to 1.85
        # and `clap` is unpinned.
        rust: ["1.85"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2

      # Package-scoped, not `--workspace`: the 1.85 floor is a promise about
      # the library crates (`jparser`, `jmdict-source`), not about
      # `src-tauri`. Tauri's own transitive dependency tree (`darling`,
      # `icu_*`, `plist`, `serde_with`, `time`, ...) needs rustc 1.86-1.88,
      # newer than this floor — that's the GUI shell's toolchain to track
      # (see its `rust-version` in `src-tauri/Cargo.toml`), not the library's.
      # Also why this job no longer installs Tauri's system dependencies:
      # nothing here compiles `src-tauri` anymore.
      #
      # Library and binary targets only — deliberately not `--all-targets`.
      # MSRV is a promise to whoever compiles this workspace's crates, and
      # dev-dependencies never reach them.
      - run: cargo check -p jparser -p jmdict-source

      # `mecab` is off by default, so the check above never compiles `vibrato`
      # or its transitive `bincode 2.0.1` — the entire reason the floor moved
      # to 1.85 this phase. Without this step, a future `vibrato` release that
      # raises its own MSRV past 1.85 would pass every gate here and ship
      # invisibly.
      - run: cargo check -p jparser --features mecab

  purity:
    name: jparser stays pure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The parser library must build with no HTTP client and no decompressor.
      # `jmdict-source` is optional behind a default-on `cli` feature, so with
      # default features off none of it may appear in the tree.
      - name: library builds without the cli feature
        run: cargo check -p jparser --no-default-features --all-targets

      - name: no http client or decompressor in the library
        run: |
          if cargo tree -p jparser --no-default-features \
             | grep -E "jmdict-source|vibrato-source|ureq|flate2|vibrato"; then
            echo "::error::jparser's library pulled in a cli-only dependency"
            exit 1
          fi

      # TLS stays pure Rust: OpenSSL links a system C library, so no dependency
      # may pull in native-tls/OpenSSL — now or in any later phase. A C
      # toolchain in the build is the cost, and every platform's release build
      # would have to carry it.
      #
      # `ring` (C and assembly) and `aws-lc-sys` (a BoringSSL fork) are refused
      # for the same reason. Phase 5A's HTTPS therefore runs on `rustls` with
      # `rustls-graviola` (pure Rust, ISC) injected as the provider — if a build
      # error here tempts you to enable ureq's default features, that silently
      # takes `ring` back, and this grep is the only thing that would notice.
      #
      # The pattern is anchored, and deliberately not `-i`: a bare `openssl`
      # also matches `openssl-probe`, which `rustls-native-certs` pulls in on
      # Linux via `rustls-platform-verifier`. That crate links nothing — it only
      # locates the system trust store — so it is not what this gate is for.
      # Since this job only ever runs on ubuntu-latest, the unanchored pattern
      # matched `openssl-probe v0.2.1` and failed the job on every run. Do not
      # re-broaden it back to a bare `openssl`: a real OpenSSL link appears as
      # `openssl v` or `openssl-sys`, and both are still caught.
      - name: no native-code TLS backend
        run: |
          if cargo tree --workspace | grep -E "openssl v|openssl-sys|native-tls|\bring v|aws-lc"; then
            echo "::error::a native-code TLS dependency entered the tree"
            exit 1
          fi

  mecab:
    name: jparser with mecab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # `mecab` is off by default (see Cargo.toml), so the `purity` job above
      # never compiles `hints.rs`. The `test` job's `cargo test --workspace`
      # now does, incidentally: `src-tauri` enables `jparser/mecab`
      # unconditionally, and Cargo's feature unification carries that into
      # every workspace-wide command. This job stays anyway because its
      # `clippy -p jparser --features mecab --all-targets` isolates
      # mecab-specific lints to a scope a workspace-wide clippy run does not
      # guarantee.
      - run: cargo test -p jparser --features mecab
      - run: cargo clippy -p jparser --features mecab --all-targets -- -D warnings

  hints:
    name: jparser with hints-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # `hints-source` is off by default and implied by nothing — not by `cli`,
      # not by `mecab` — so without this job neither `tests/cli_hints.rs` nor
      # the `Command::FetchHints` match arm (both behind `#[cfg(feature =
      # "hints-source")]`) is type-checked anywhere in CI. Design spec §9.5
      # lists this gate; it did not reach this file until the Phase 5A fix wave.
      # Mirrors the `mecab` job above deliberately.
      - run: cargo test -p jparser --features hints-source
      - run: cargo clippy -p jparser --features hints-source --all-targets -- -D warnings

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2

      - run: cargo llvm-cov -p jmdict-source --summary-only --fail-under-lines 80
      - run: cargo llvm-cov -p jparser --features mecab --summary-only --fail-under-lines 80

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx playwright install --with-deps chromium
      # `e2e/panes.spec.ts` guards its own `toHaveScreenshot` calls with
      # `if (!process.env.CI)`: the committed baselines under
      # e2e/panes.spec.ts-snapshots/ were written and eyeballed on macOS, and
      # this runner is ubuntu-latest — different font rendering means those
      # baselines would mismatch on every run here regardless of whether the
      # app is actually correct. There is no git remote on this repository, so
      # there is no way to run a real Linux job and capture Linux baselines to
      # commit instead. GitHub Actions sets `CI=true` automatically, so this
      # job runs every DOM assertion in panes.spec.ts on every run and skips
      # only the pixel comparison; the full visual comparison still runs
      # wherever the baselines are valid (this developer's machine).
      - run: npx playwright test
