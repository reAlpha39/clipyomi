[package]
name = "clipyomi"
version = "0.1.1"
edition.workspace = true
license.workspace = true
# Not `rust-version.workspace = true`: the workspace floor (1.85) is a promise
# about `jparser`, the reusable library. This crate tracks its own GUI
# toolchain instead. 1.88 is the highest floor any of Tauri's transitive
# dependencies actually declares today (`darling`, `icu_collections`,
# `icu_locale_core`, `icu_normalizer(_data)`, `icu_properties(_data)`,
# `icu_provider`, `plist`, `serde_with(_macros)`, `time`/`time-core`/
# `time-macros` all require 1.88; `idna_adapter` requires only 1.86) —
# captured from `cargo +1.85 check --workspace`'s failure output.
# Raised 1.88 -> 1.89 on 2026-09-16: this crate depends *directly* on
# `vibrato-source` (below), whose own `rust-version` is 1.89, and Cargo
# treats a dependency whose floor exceeds the active toolchain as a hard
# error. 1.88 was therefore a promise this crate could not keep, and
# nothing caught it: CI's `msrv` job checks `-p jparser -p jmdict-source`
# only, never the shell. The Tauri-transitive figures below are still the
# reason the floor is not 1.85; they are simply no longer the binding one.
rust-version = "1.89"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what `macOSPrivateApi` in tauri.conf.json requires:
# transparency on macOS goes through a private NSWindow API. It rules out Mac
# App Store distribution, which this self-distributed build already
# accepts (spec §7.5).
tauri = { version = "2", features = ["macos-private-api"] }
# `mecab` is enabled here and nowhere else: the shell is the only consumer that
# wants a tokenizer, and `jparser` itself must stay pure.
jparser = { path = "../crates/jparser", features = ["mecab"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# `tauri::async_runtime` re-exports mpsc, Mutex, and RwLock but not `watch`, and
# its own module doc says to use tokio directly when what you need is missing.
# tokio 1.53 is already in the tree via tauri, so this adds no transitive weight.
# `macros` and `rt` are for `#[tokio::test]`; `time` is for the poll's sleep.
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
# MIT OR Apache-2.0, the same pair this project offers.
tauri-plugin-clipboard-manager = "2.3.2"
# The first network code in the shell. `crates/jparser` must stay pure — the
# purity gate guards it — but the shell is where a download belongs, and
# `jmdict-source` already owns the retry, staging, and gzip handling.
jmdict-source = { path = "../crates/jmdict-source" }
# Added directly, the way `jmdict-source` is, rather than through `jparser`'s
# `hints-source` feature: that feature is the CLI driver's gate, and routing the
# shell's acquisition through it would put a TLS stack behind a library feature
# flag instead of in the binary that actually downloads. `ci.yml`'s purity gate
# still proves `jparser --no-default-features` pulls in neither source crate.
vibrato-source = { path = "../crates/vibrato-source" }
# MIT OR Apache-2.0, the same pair this project offers. Same for its
# `global-hotkey` dependency.
tauri-plugin-global-shortcut = "2.3.2"
# The installed font families for the settings window, both MIT OR Apache-2.0.
# `font-enumeration` asks the platform — DirectWrite, CoreText, fontconfig —
# because that is what the webview resolves CSS `font-family` against; a name
# read from the file itself can differ and then never renders. `ttf-parser`
# reads each file's cmap so the sentence and furigana selects can list only
# families with Japanese glyphs.
font-enumeration = "0.9"
ttf-parser = "0.25"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

