[package]
name = "jparser"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bincode = "1.3"
clap = { version = "4", features = ["derive"] }
fst = "0.4"
memmap2 = "0.9"
quick-xml = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
insta = "1"

[[bin]]
name = "jparser-cli"
path = "src/bin/jparser-cli.rs"
