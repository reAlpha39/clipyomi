[package]
name = "jmdict-source"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# `~3.2` not `3.2`: a caret requirement resolves to 3.4.0, whose rust-version is
# 1.85 and breaks the workspace MSRV of 1.75. Do not loosen this.
#
# No TLS backend: EDRDG serves no usable HTTPS for this archive (certificate
# subject-name mismatch), so this crate fetches over plain HTTP only. Adding
# `rustls` back would also pull in `zeroize`, whose 1.9.0 requires edition2024
# and breaks the same MSRV floor. Do not add a TLS feature back.
ureq = { version = "~3.2", default-features = false }
flate2 = "1"
thiserror = "1"
