[package]
name = "jparser"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["cli"]
# Pulls in the dictionary-source crate for `jparser-cli`. The library must build
# without it: `cargo check -p jparser --no-default-features` is the gate that
# keeps an HTTP client and a decompressor out of the parser.
cli = ["dep:jmdict-source"]

[dependencies]
bincode = "1.3"
# Pinned exactly, not `4`: clap_builder moved to clap_lex 1.x partway through the
# 4.5 line (4.5.61 already requires it), and clap_lex 1.1 needs edition2024, i.e.
# Rust 1.85 — above the workspace MSRV of 1.75. A range does not help, because
# `resolver = "2"` ignores rust-version when choosing versions and would take the
# newest match. 4.5.51 is the version compile-verified against the 1.75 toolchain.
# Constraining clap_lex directly does not work either: cargo permits the 0.7 and
# 1.x majors side by side, so clap_builder keeps its own copy.
clap = { version = "=4.5.51", features = ["derive"] }
fst = "0.4"
jmdict-source = { path = "../jmdict-source", optional = true }
memmap2 = "0.9"
quick-xml = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
insta = "1"

[[bin]]
name = "jparser-cli"
path = "src/bin/jparser-cli.rs"
required-features = ["cli"]

[[test]]
name = "cli_generations"
path = "tests/cli_generations.rs"
required-features = ["cli"]
