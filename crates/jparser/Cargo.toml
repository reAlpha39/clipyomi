[package]
name = "jparser"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["cli"]
# Pulls in the dictionary-source crate for `jparser-cli`. The library must build
# without it: `cargo check -p jparser --no-default-features` is the gate that
# keeps an HTTP client and a decompressor out of the parser.
cli = ["dep:jmdict-source"]
# Vibrato-backed BoundaryHints. Off by default: the parser library must build
# without a tokenizer, and `cargo check -p jparser --no-default-features` is the
# gate that proves it.
mecab = ["dep:vibrato"]
# The `fetch-hints` driver. Deliberately NOT implied by `cli`, which is on by
# default, nor by `mecab`, which `src-tauri` enables: either would put a TLS
# stack and an archive-unpacking stack into the shell's build months before 5B
# wants them there. 5B adds `vibrato-source` to `src-tauri` directly, the way
# 2F added `jmdict-source`.
hints-source = ["dep:vibrato-source", "mecab"]

[dependencies]
bincode = "1.3"
clap = { version = "4", features = ["derive"] }
fst = "0.4"
jmdict-source = { path = "../jmdict-source", optional = true }
memmap2 = "0.9"
quick-xml = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# `default-features = false` drops vibrato's default `train` feature and the
# `rucrf` training stack with it — nothing here trains a model.
vibrato = { version = "0.5", default-features = false, optional = true }
vibrato-source = { path = "../vibrato-source", optional = true }

[dev-dependencies]
insta = "1"

[[bin]]
name = "jparser-cli"
path = "src/bin/jparser-cli/main.rs"
required-features = ["cli"]

[[test]]
name = "cli_generations"
path = "tests/cli_generations.rs"
required-features = ["cli"]

[[test]]
name = "cli_hints"
path = "tests/cli_hints.rs"
# `cli` as well as `hints-source`: this test runs the binary through
# `env!("CARGO_BIN_EXE_jparser-cli")`, and the binary is itself
# `required-features = ["cli"]`. Without `cli` here,
# `--no-default-features --features hints-source` builds the test without the
# binary and it fails to compile. `cli_generations` above already pairs them.
required-features = ["hints-source", "cli"]

[[test]]
name = "entry_id"
path = "tests/entry_id.rs"

[[test]]
name = "cli_score"
path = "tests/cli_score.rs"
required-features = ["cli"]
