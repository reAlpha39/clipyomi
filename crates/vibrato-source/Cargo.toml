[package]
name = "vibrato-source"
version = "0.1.0"
edition.workspace = true
license.workspace = true
# Not `rust-version.workspace = true`: the workspace floor (1.85) is a promise
# about the reusable library crates, and this crate's dependency stack cannot
# keep it. `graviola 0.4.1` (under `rustls-graviola`) declares 1.89 and
# `ruzstd 0.9.0` declares 1.87 — read from the resolved packages, not assumed —
# and Cargo treats a dependency whose `rust-version` exceeds the active
# toolchain as a hard error, not a warning. Declaring 1.85 here would be a
# promise the crate cannot keep. Same reasoning as `src-tauri/Cargo.toml`.
rust-version = "1.89"

[dependencies]
# GitHub serves no plain HTTP, so unlike `jmdict-source` this crate needs TLS.
# `rustls` is MIT OR Apache-2.0 OR ISC — but its default crypto providers are
# NOT usable here: `ring` builds C and assembly and `aws-lc-sys` builds a
# BoringSSL fork, and no platform's build may need a C toolchain. Hence
# `rustls-no-provider` plus the pure-Rust provider below.
ureq = { version = "3", default-features = false, features = [
    "rustls-no-provider",
    "platform-verifier",
] }
# Apache-2.0 OR ISC OR MIT-0, taken under ISC. Pure Rust, x86_64 and aarch64.
rustls-graviola = "0.4"
# MIT. Pure-Rust xz, so no C toolchain enters any platform's build.
lzma-rs = "0.3"
# MIT OR Apache-2.0, taken under MIT.
tar = "0.4"
# MIT. Pure-Rust zstd.
ruzstd = "0.9"
# MIT OR Apache-2.0, taken under MIT.
sha2 = "0.11"
thiserror = "1"

[dev-dependencies]
# Fixtures are built, never committed: `SystemDictionaryBuilder` makes the same
# two-entry dictionary `jparser`'s `hints.rs` uses in its own tests.
# `default-features = false` drops vibrato's `train` feature, as jparser does.
vibrato = { version = "0.5", default-features = false }
